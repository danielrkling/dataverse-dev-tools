<!doctype html>
<html lang="en" class="wa-dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web IDE</title>
  <!-- Required: default theme + autoloader -->
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.12.0/styles/themes/default.css" />
  <script type="module" src="https://ka-f.webawesome.com/webawesome@3.12.0/webawesome.loader.js"></script>

  <!-- Recommended: utility classes ("CSS Utilities") -->
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.12.0/styles/utilities.css" />

  <!-- Optional: CSS reset ("Native Styles") -->
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.12.0/styles/native.css" />


  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      height: 100%;
    }

    body>div {
      overflow: hidden;
    }

    wa-split-panel {
      height: 100%;
      background: #1e1e1e;
      color-scheme: dark;
      --divider-width: 4px;
      --divider-hit-area: 10px;
      /* Keep the sidebar a fixed-ish size on host resize. */
      --min: 0px;
      --max: 100%;
    }

    /* Accent the divider on hover/drag/focus */
    wa-split-panel::part(divider) {
      transition: background 0.12s;
      background: #222;
    }

    wa-split-panel::part(divider):hover,
    wa-split-panel::part(divider):active {
      background: #333;
    }

    /* Slotted panes fill their grid cell; their component children are
       absolutely positioned to fill the pane. This keeps the (potentially
       huge) content from feeding the split panel's grid track sizing, so the
       track stays bounded and only an inner scroll area (e.g. the terminal
       output) scrolls. */
    #pane-sidebar,
    #pane-editor,
    #pane-terminal {
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }

    #pane-sidebar>*,
    #pane-editor>*,
    #pane-terminal>* {
      position: absolute;
      inset: 0;
      min-width: 0;
      min-height: 0;
    }
  </style>
  <script type="importmap">
      {
        "imports": {
          "@pierre/trees": "https://esm.sh/@pierre/trees@1.0.0-beta.6",
          "@pierre/trees/web-components": "https://esm.sh/@pierre/trees@1.0.0-beta.6/web-components",
          "@optique/core": "https://esm.sh/@optique/core@1.1.1",
          "isomorphic-git": "https://esm.sh/isomorphic-git@1.27.1",
          "tailwindcss": "https://esm.sh/tailwindcss@4.1.6",
          "picomatch": "https://esm.sh/picomatch@4.0.5",
          "string-argv": "https://esm.sh/string-argv@0.3.2",
          "esbuild-wasm": "https://esm.sh/esbuild-wasm@0.28.1",
          "zod": "https://esm.sh/zod@3.24.4",
          "lit": "https://esm.sh/lit@3.3.1",
          "modern-monaco": "https://esm.sh/modern-monaco@0.4.2"
        }
      }
    </script>
  <script type="module">
    window.addEventListener("keydown", async (e) => {
      if (e.ctrlKey && e.key === "`") {
        await import("//cdn.jsdelivr.net/npm/eruda");
        eruda.init();
      }
    });
  </script>
  <!-- Web Awesome split panel (light-DOM layout layer only) -->

  <script src="src/main.mjs" defer type="module"></script>
</head>

<body>
  <div style="width: 100vw; height: 100vh; box-sizing: border-box; overflow: hidden;">
    <wa-split-panel style="height: 100vh; width: 100vw;" id="root" primary="start" position-in-pixels="250" snap="0"
      snap-threshold="20">
      <div style="display: flex;" id="pane-sidebar" slot="start"><file-tree></file-tree></div>
      <wa-split-panel slot="end" orientation="vertical" id="inner" snap="0% 100%" snap-threshold="80"
        position-in-pixels="600">
        <div style="display: flex; width: 100%;" id="pane-editor" slot="start"><editor-pane></editor-pane></div>
        <div style="display: flex; width: 100%;" id="pane-terminal" slot="end"><web-terminal></web-terminal></div>
      </wa-split-panel>
    </wa-split-panel>
  </div>
</body>

</html>
